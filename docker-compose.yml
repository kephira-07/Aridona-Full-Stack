version: '3.8'

services:
  # 1. Le Backend (Node.js API)
  backend:
    build: ./Backend
    ports:
      - "127.0.0.1:3001:4000"
    env_file:
      - ./Backend/.env
    environment:
      - NODE_ENV=production
      - PORT=4000
      - FRONTEND_URL=https://aridona.store
    restart: unless-stopped

  # 2. Le Client (Vite + Nginx)
  client:
    build: ./client
    ports:
      - "127.0.0.1:3002:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 3. L'Admin (Vite + Nginx)
  admin:
    build: ./admin
    ports:
      - "127.0.0.1:3003:80"
    depends_on:
      - backend
    restart: unless-stopped
