server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Cache long terme (1 an) pour les assets Vite (noms hashés)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 410 Gone permanent pour les anciens faux produits de test (mocks) afin que Google Search Console et Merchant Center les désindexent immédiatement
    location ~* ^/produit/(p00[0-9]|p010|collier-etoile-argent|boucles-doreilles-perle|chaine-a-lunettes-doree|bracelet-tresse-cuir|bague-saphir-royal|ensemble-collier-boucles-cristal|collier-quartz-rose|boucles-doreilles-creoles-dorees|bracelet-pierre-volcanique|ensemble-bague-collier-rubis)/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
