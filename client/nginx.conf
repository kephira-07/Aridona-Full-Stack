server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # En-têtes de sécurité HTTP (Mozilla Observatory / HSTS / CSP / Clickjacking)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.aridona.store https://accounts.google.com; frame-src 'self' https://accounts.google.com; frame-ancestors 'self'; object-src 'none'; base-uri 'self';" always;

    # Manifeste Agentic Resource Discovery (accessible sur /ai-catalog.json et /.well-known/ai-catalog.json)
    location = /ai-catalog.json {
        alias /usr/share/nginx/html/.well-known/ai-catalog.json;
        default_type application/json;
    }

    # Cache long terme (1 an) pour les assets Vite (noms hashés)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 410 Gone permanent pour les anciens faux produits de test (mocks) afin que Google Search Console et Merchant Center les désindexent immédiatement
    location ~* ^/produit/(p00[0-9]|p010|collier-etoile-argent|boucles-doreilles-perle|chaine-a-lunettes-doree|bracelet-tresse-cuir|bague-saphir-royal|ensemble-collier-boucles-cristal|collier-quartz-rose|boucles-doreilles-creoles-dorees|bracelet-pierre-volcanique|ensemble-bague-collier-rubis)/?$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 410;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
